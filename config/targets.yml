# config/targets.yml — the ONE place that says which jobs we look for.
#
# Read by (see targets.mjs):
#   scan.mjs, scan-ats-full.mjs
#     - `match` words of every group = the title filter: a title must contain one.
#     - `drop` words = titles always rejected, unless a `rescue` word is also
#       in the title ("Presales Engineer" has "sales" but is kept).
#     - `non_fit` words = rejected only when no `match` word is in the title.
#     - `rescue` words also count as a match, so those titles pass.
#       While this file exists, title_filter.positive/negative in portals.yml
#       are ignored. (title_filter_full, the strict list for the full ATS sweep,
#       still wins there.)
#     - `too_many_years`: a posting that asks for this many years of
#       experience or more is not saved.
#     - `search` words of every group = what is typed into the job boards
#       (WTJ, APEC, HelloWork, Free-Work, France Travail, LinkedIn) whose
#       portals.yml block has no `queries:` of its own. A block that keeps its
#       own `queries:` uses them instead (LinkedIn may want fewer: every search
#       costs pages against its rate limit).
#   freemotion-night/pool-rules.mjs (tonight's list)
#     - keeps a job whose title matches a group and no drop word;
#     - adds each tier's points once (Python Data Engineer: data + python = 1.5,
#       not 3; Cloud Data Engineer: cloud + data = 3.5);
#     - ranks `rank_low` titles down (-4).
#
# How a word matches a title (the same rules as title_filter, title-keywords.mjs):
#   plain          anywhere in the title: "devops" matches "DevOps/SRE"
#   2-3 letters    whole word automatically: "ia" matches "Ingénieur IA", not "média"
#   word:x         whole word only: "word:lead" matches "Lead Dev", not "Leader"
#   stem:x         start of a word: "stem:alternan" matches alternance, alternant
# Case never matters. Write French words WITH their accents: each one also
# matches the same word typed without them ("ingénieur" = "ingenieur").
#
# Check what portals.yml still duplicates: node targets.mjs check

tiers:
  - points: 2
    groups:
      cloud:
        search: []
        match: [cloud, aws, azure, gcp, devops, sre, site reliability, platform, infrastructure,
                kubernetes, devsecops, finops, mlops, terraform, observability, observabilité]

  - points: 1.5
    groups:
      data:
        search: []
        match: [data engineer, ingénieur data, data platform, analytics engineer, big data, dataops]
      systems:
        search: []
        match: [système, system engineer, systems engineer, system architect, systems architect,
                "word:mbse", "word:sysml", capella, "word:doors", requirements, exigences,
                ivv, "word:ivvq", v&v, intégration, segment sol,
                ground segment, géomat, geospati, sig, observation de la terre, earth observation]
      python:
        search: []
        match: [python, backend, back-end, software engineer]

  - points: 0.5
    groups:
      software:
        search: []
        match: [développeur, developer, logiciel, software, fullstack, full-stack, full stack,
                ml, machine learning, ia, ai engineer, data scientist, data analyst, "word:data",
                données,
                # Embedded and bare validation titles: found, but ranked low (user, 2026-09-26).
                embarqu, embedded, validation, vérification]

drop:
  contract: ["word:stage", "word:stagiaire", "word:intern", "word:internship", "stem:alternan",
             "stem:apprenti", "word:trainee", "word:freelance", "word:intérim"]
  # Only the top of the ladder. Lead, manager, responsable, chef de projet,
  # product owner, principal, staff and chief are kept: too_many_years decides.
  seniority: ["word:director", "word:directeur", "word:directrice", vp, "word:head of"]
  frontend: [frontend, front-end, front end, "word:react", angular, vue, "word:vuejs"]

# Other fields. Softer than `drop`: a title with one of these and none of our
# role words is dropped ("Comptable Fournisseurs"); a title that also has a
# role word is kept but marked unsure, for the model to decide
# ("Senior Software Engineer - Sales Customer Care", "Technicien Cloud Azure").
non_fit: [technicien, commercial, "word:sales", comptable, chantier, conducteur de travaux,
          business developer, infirmier, avocat, juriste, magasinier, logistique, mécanique,
          génie civil, bâtiment, vrd, électricien, soudeur, maintenance cvc]

# Never dropped, even with a drop or non-fit word in the title; counted as a match.
rescue: [pre-sales, presales, pre sales, avant-vente, avant vente, sales engineer,
         solutions engineer, solution engineer, solutions architect, solution architect,
         technico-commercial]

# Allowed, but ranked low: off our stack.
rank_low: [salesforce, go, golang, "word:rust", .net, "c#", "word:java", php, sap]

too_many_years: 8

# Sectors on the night list (user, 2026-10-04). Judged per job from its title,
# company and posting text (freemotion-night/llm-sector.mjs): the sector the
# WORK is for, not the sectors a consultancy lists. Known sectors: defence,
# space, government, clearance (needs a security clearance, "habilitable", or
# a nationality). `drop` removes the job; `penalty` is added to its rank
# (fit 1-5 plus the small place/language nudges), so -1 puts a space job
# below every comparable non-space one.
sectors:
  drop: [defence, government, clearance]
  penalty:
    space: -1.0

# The quick title check (freemotion-night/llm-score.mjs gateJobs; issue #21). Titles in our
# fields (a role group worth 1.5+ points) skip it. Every other title gets a go / no-go from the
# model on title, company and place only.
#   strict  a title passes only when its main work is in `experience` below: a role held, a
#           skill or tool, a domain, all taken from cv.md. A vague title ("Ingénieur H/F")
#           still passes: a later step reads the posting.
#   loose   any digital work passes (the check before 2026-10-06).
# Answers are kept per mode in data/llm-gate.tsv; strict answers are asked again when this
# list changes. `--gate strict|loose` on make-pool.mjs / score-loop.mjs overrides the mode once.
gate:
  mode: loose   # strict once the list below is confirmed (2026-10-06)
  experience:
    roles:
      - Cloud / DevOps / SRE / platform engineer (AWS, Azure, Kubernetes, Terraform, CI/CD, monitoring)
      - Data engineer (pipelines, ETL, Airflow, geospatial and satellite-imagery data)
      - Systems engineer / MBSE (requirements, interfaces, architecture, V&V, IVV, integration)
      - Backend / software developer (Python, C++, C#/.NET, Java, TypeScript/Node.js; REST APIs)
      - Software architect
      - Full-stack developer (.NET or Node backend, Angular frontend)
      - Computer-vision / AI pipeline developer (GPU, real-time video)
      - Data / quality-data analyst (dashboards, KPIs, Power BI, Palantir Foundry)
    skills:
      - AWS (EKS, EC2, S3, IAM), Azure, Docker, Kubernetes, Helm, Terraform, CloudFormation
      - GitHub Actions, Jenkins, Azure DevOps, GitOps
      - Prometheus, Grafana, Alertmanager, Loki
      - Apache Airflow, Python, Pandas, SQL, MongoDB, PostGIS, Redis
      - FastAPI, Express.js, REST APIs, microservices
      - C++ (real-time, performance), CUDA / TensorRT / Nvidia DeepStream
      - GDAL, Rasterio, STAC, Google Earth Engine
      - SysML / Capella (in progress), requirements management, ISO/IEC 15288, ARP4754 / DO-178 (coursework)
      - Linux, log analysis
    domains:
      - Aerospace (aircraft programmes, quality / non-conformance)
      - Earth observation and geospatial
      - Space systems (coursework, student missions)
      - Finance software, e-commerce, HR / workforce analytics

# What the night list's model scores each job against. No name, contact
# details or salary here: this is the only thing about the candidate that
# goes to the model (freemotion-night/llm-score.mjs).
# Left out on purpose, filled in at run time from the files the applier
# already reads (both stay out of git): years_experience from cv.md, and
# security_clearance / work_authorization from config/profile.yml
# application_answers. A value written here wins over those.
candidate:
  trade: Cloud & data engineer with formal systems-engineering training; digital work is the main strength.
  # Same order as config/profile.yml target_roles (ranked by the user).
  target_work:
    - Cloud / DevOps / SRE / platform engineering (AWS, Kubernetes, Terraform)
    - Systems engineering / MBSE (requirements, interfaces, V&V, IVV, ground segment)
    - Data engineering (Airflow, Python, SQL, geospatial pipelines)
    - Backend development (Python, C++, TypeScript)
    - AI engineering
  also_fits:
    - Pre-sales / solutions engineering
    - Technical consulting
    - IT product roles
    - Team or project lead on a digital team
  degree: >-
    Mastère Spécialisé in Systems Engineering, ISAE-SUPAERO (Bac+6, 2026) and a Master's in
    Computer Science for Aerospace (Université Toulouse III); not a French "ingénieur diplômé"
  certificates: [INCOSE Associate Systems Engineering Professional (ASEP), AWS Certified Solutions Architect – Associate]
  languages: English C2, Arabic C2, French B2
  places: Toulouse first, then anywhere in France; fully remote from France also fine
  contract: CDI
